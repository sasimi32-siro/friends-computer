<!-- 로그인 오버레이 -->

    <input id="login-pw" type="password" placeholder="관리자 비밀번호" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box;" onkeypress="if(event.key==='Enter')tryLogin()" />
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button onclick="closeLogin()" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer;font-size:15px;">취소</button>
      <button onclick="tryLogin()" style="flex:1;padding:12px;border:none;border-radius:8px;background:#3b82f6;color:white;cursor:pointer;font-size:15px;font-weight:600;">로그인</button>
    </div>
    <p style="color:#999;font-size:11px;margin:12px 0 0;text-align:center;">로그인 정보는 브라우저 종료 시까지 유지됩니다</p>
  </div>
</div>

<!-- 우측 상단 관리자 버튼 -->
<div style="position:fixed;bottom:20px;right:20px;z-index:99999;display:flex;gap:6px;flex-direction:column;align-items:flex-end;">
  <button onclick="showLogin()" style="padding:8px 14px;border:none;border-radius:6px;background:#3b82f6;color:white;cursor:pointer;font-size:13px;font-weight:600;">🔑 관리자 로그인</button>
  <button onclick="logout()" style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:13px;">로그아웃</button>
  <button onclick="initialBulkImport()" style="padding:8px 12px;border:1px solid #f59e0b;border-radius:6px;background:#fef3c7;color:#92400e;cursor:pointer;font-size:13px;" title="최초 1회만 실행">📤 초기데이터 업로드</button>
  <button onclick="document.getElementById('csv-input').click()" style="padding:8px 14px;border:none;border-radius:6px;background:#10b981;color:white;cursor:pointer;font-size:13px;font-weight:600;">📂 CSV 가져오기</button>
  <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="handleCSVUpload(event)" />
</div>

<header>
  <h1>에어컨 청소 고객 관리 <span>전체</span></h1>

    <button class="btn btn-danger" onclick="resetData()">🔄 초기화</button>
  </div>
</header>

    <button class="fbtn" data-f="type" data-v="wall" onclick="setFilter(this,'type','wall')">벽걸이</button>
  </div>
</div>
<div class="count-bar" id="countbar"></div>
<div class="table-wrap">

<thead><tr>

</div>

    </div>
  </div>
</div>

// ============ 서버 API 설정 ============
const API_URL = 'api.php';  // 같은 폴더에 있어야 함
let ADMIN_PW = sessionStorage.getItem('admin_pw') || '';

async function apiGet(){
  try{
    const res = await fetch(API_URL);
    const json = await res.json();
    if(json.success) return json.data;
    return null;
  }catch(e){
    console.error('API 오류:', e);
    alert('서버 연결 실패. 인터넷 또는 API 파일을 확인하세요.');
    return null;
  }
}

async function apiPost(action, payload){
  try{
    const body = {action, admin_pw: ADMIN_PW, ...payload};
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const json = await res.json();
    if(json.error){
      if(res.status === 401){
        alert('관리자 비밀번호가 틀렸습니다. 다시 로그인해주세요.');
        sessionStorage.removeItem('admin_pw');
        ADMIN_PW = '';
        showLogin();
        return null;
      }
      alert('오류: '+json.error);
      return null;
    }
    return json;
  }catch(e){
    console.error(e);
    alert('서버 연결 실패');
    return null;
  }
}

// ============ 로그인 화면 ============
function showLogin(){
  document.getElementById('login-overlay').style.display = 'flex';
}
function closeLogin(){
  document.getElementById('login-overlay').style.display = 'none';
}
function tryLogin(){
  const pw = document.getElementById('login-pw').value;
  if(!pw){alert('비밀번호를 입력하세요');return;}
  ADMIN_PW = pw;
  sessionStorage.setItem('admin_pw', pw);
  closeLogin();
  alert('로그인 성공! 이제 추가/수정/삭제 가능합니다.');
}
function logout(){
  ADMIN_PW = '';
  sessionStorage.removeItem('admin_pw');
  alert('로그아웃 되었습니다.');
  location.reload();
}
function isAdmin(){
  return ADMIN_PW !== '';
}

      ...INIT_ISW.map((c,i)=>({...c,id:'isw_'+i}))
    ];
  }
}

// 초기 데이터를 서버로 한번에 보내기 (최초 1회)
async function initialBulkImport(){
  if(!isAdmin()){alert('먼저 관리자 로그인 해주세요!');showLogin();return;}
  if(!confirm('초기 2,696건 데이터를 서버에 업로드합니다. 시간이 좀 걸려요. 진행할까요?'))return;
  
  const merged = [
    ...INIT_JSC.map((c,i)=>({...c,id:'jsc_'+i})),
    ...INIT_2023.map((c,i)=>({...c,id:'2023_'+i})),
    ...INIT_2024.map((c,i)=>({...c,id:'2024_'+i})),
    ...INIT_2025_YH.map((c,i)=>({...c,id:'25yh_'+i})),
    ...INIT_2025_RJS.map((c,i)=>({...c,id:'25rjs_'+i})),
    ...INIT_2024_JSY.map((c,i)=>({...c,id:'24jsy_'+i})),
    ...INIT_IDY.map((c,i)=>({...c,id:'idy_'+i})),
    ...INIT_JSH.map((c,i)=>({...c,id:'jsh_'+i})),
    ...INIT_LHK.map((c,i)=>({...c,id:'lhk_'+i})),
    ...INIT_ISW.map((c,i)=>({...c,id:'isw_'+i}))
  ];
  
  // 500개씩 끊어서 업로드 (한번에 보내면 서버 부담)
  const chunkSize = 500;
  let totalUploaded = 0;
  for(let i = 0; i < merged.length; i += chunkSize){
    const chunk = merged.slice(i, i + chunkSize);
    const res = await apiPost('bulk_import', {customers: chunk});
    if(res && res.success){
      totalUploaded += res.imported;
      console.log(`업로드 진행: ${totalUploaded}/${merged.length}`);
    }else{
      alert('업로드 실패. 중단합니다.');
      return;
    }
  }
  alert(`✅ 총 ${totalUploaded}건 업로드 완료!\n페이지를 새로고침합니다.`);
  location.reload();
}

// ============ CSV 업로드 처리 ============
async function handleCSVUpload(event){
  if(!isAdmin()){
    alert('관리자 로그인이 필요합니다');
    showLogin();
    event.target.value = '';
    return;
  }
  
  const file = event.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const text = e.target.result;
      const customers = parseCSV(text);
      
      if(customers.length === 0){
        alert('❌ CSV 파일에서 데이터를 읽을 수 없습니다.\n\n컬럼 순서 확인:\n전화번호,이름,주소,서비스종류,서비스상세,금액,년도,기사명,메모');
        event.target.value = '';
        return;
      }
      
      // 미리보기
      const preview = customers.slice(0, 3).map(c => 
        `• ${c.name}(${c.phone}) - ${c.agent || '미지정'} - ${(c.price||0).toLocaleString()}원`
      ).join('\n');
      
      const ok = confirm(
        `📂 CSV 파일에서 ${customers.length}건 발견\n\n` +
        `미리보기:\n${preview}\n\n` +
        `이 데이터를 전산에 추가할까요?\n` +
        `(같은 ID가 있으면 건너뜁니다)`
      );
      
      if(!ok){
        event.target.value = '';
        return;
      }
      
      // 500개씩 업로드
      const chunkSize = 500;
      let totalUploaded = 0;
      for(let i = 0; i < customers.length; i += chunkSize){
        const chunk = customers.slice(i, i + chunkSize);
        const res = await apiPost('bulk_import', {customers: chunk});
        if(res && res.success){
          totalUploaded += res.imported;
        }else{
          alert(`업로드 중 오류 발생. 지금까지 ${totalUploaded}건 처리됨.`);
          event.target.value = '';
          return;
        }
      }
      
      alert(`✅ ${totalUploaded}건 추가 완료!\n페이지를 새로고침합니다.`);
      location.reload();
    }catch(err){
      console.error(err);
      alert('❌ CSV 파일 처리 중 오류:\n' + err.message);
    }
    event.target.value = '';
  };
  
  reader.onerror = function(){
    alert('❌ 파일 읽기 실패');
    event.target.value = '';
  };
  
  reader.readAsText(file, 'UTF-8');
}

// CSV 파싱 함수 (큰따옴표, 쉼표, 줄바꿈 처리)
function parseCSV(text){
  // BOM 제거
  if(text.charCodeAt(0) === 0xFEFF){
    text = text.slice(1);
  }
  
  const rows = [];
  let current = [];
  let field = '';
  let inQuotes = false;
  
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    const next = text[i+1];
    
    if(inQuotes){
      if(ch === '"' && next === '"'){
        field += '"';
        i++;
      }else if(ch === '"'){
        inQuotes = false;
      }else{
        field += ch;
      }
    }else{
      if(ch === '"'){
        inQuotes = true;
      }else if(ch === ','){
        current.push(field);
        field = '';
      }else if(ch === '\n' || ch === '\r'){
        if(ch === '\r' && next === '\n') i++;
        current.push(field);
        if(current.some(v => v.trim())) rows.push(current);
        current = [];
        field = '';
      }else{
        field += ch;
      }
    }
  }
  if(field || current.length){
    current.push(field);
    if(current.some(v => v.trim())) rows.push(current);
  }
  
  if(rows.length < 2){
    return [];
  }
  
  // 헤더 행 제거 (첫번째 행)
  const header = rows[0].map(h => h.trim());
  const dataRows = rows.slice(1);
  
  // 컬럼 매핑: 전화번호,이름,주소,서비스종류,서비스상세,금액,년도,기사명,메모
  const customers = [];
  const typeMap = {
    '4웨이':'4way','4way':'4way','천장':'4way','4way2':'4way',
    '1웨이':'1way','1way':'1way',
    '투인원':'2in1','2in1':'2in1','2way':'2in1',
    '스탠드':'stand','stand':'stand',
    '벽걸이':'wall','wall':'wall','벽':'wall',
    '기타':'other','other':'other'
  };
  
  for(let r = 0; r < dataRows.length; r++){
    const row = dataRows[r];
    if(row.length < 2) continue;
    
    const phone = (row[0]||'').trim();
    const name = (row[1]||'').trim();
    if(!phone && !name) continue;  // 둘 다 비어있으면 스킵
    
    const typeRaw = (row[3]||'').trim();
    const type = typeMap[typeRaw] || typeRaw || 'other';
    
    let price = 0;
    const priceRaw = (row[5]||'').trim().replace(/[^0-9]/g, '');
    if(priceRaw) price = parseInt(priceRaw, 10) || 0;
    
    const id = 'csv_' + Date.now() + '_' + r;
    
    customers.push({
      id: id,
      phone: phone,
      name: name,
      address: (row[2]||'').trim(),
      type: type,
      service: (row[4]||'').trim(),
      price: price,
      year: (row[6]||'').trim(),
      agent: (row[7]||'').trim(),
      note: (row[8]||'').trim()
    });
  }
  
  return customers;
}


const TYPE_LABEL = {"4way":"4웨이","1way":"1웨이","2in1":"투인원","stand":"스탠드","wall":"벽걸이","other":"기타"};
const TYPE_CLASS = {"4way":"b4","1way":"b1","2in1":"b2","stand":"bs","wall":"bw","other":"bo"};
function fmt(n){ return n? n.toLocaleString()+'원':'-'; }

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = data.filter(c=>{
    if(filters.year!=='all' && c.year!==filters.year) return false;
    if(filters.agent==='none'){ if(c.agent && c.agent!=='') return false; }
    else if(filters.agent!=='all' && c.agent!==filters.agent) return false;
    if(filters.type!=='all' && c.type!==filters.type) return false;
    if(q && ![(c.phone||''),(c.name||''),(c.address||''),(c.service||''),(c.agent||''),(c.note||'')].some(v=>v.toLowerCase().includes(q))) return false;
    return true;
  });
  // 미지정 기사는 맨 하단
  list.sort((a,b)=>{
    const aEmpty = !a.agent || a.agent==='';
    const bEmpty = !b.agent || b.agent==='';
    if(aEmpty && !bEmpty) return 1;
    if(!aEmpty && bEmpty) return -1;
    return 0;
  });
  const total = list.reduce((s,c)=>s+(c.price||0),0);
  document.getElementById('countbar').innerHTML=`총 <strong>${list.length}명</strong> | 합산 <strong>${total.toLocaleString()}원</strong>`;
  document.getElementById('total-cnt').textContent=data.length+'명';
  document.getElementById('total-rev').textContent=data.reduce((s,c)=>s+(c.price||0),0).toLocaleString()+'원';
  const tb=document.getElementById('tbody');
  if(!list.length){tb.innerHTML='<tr><td colspan="9" class="empty">검색 결과가 없습니다.</td></tr>';return;}
  tb.innerHTML=list.map(c=>`<tr onclick="copyRow('${c.id}', event)" style="cursor:pointer" title="클릭하면 정보가 복사됩니다">
    <td class="name">${c.name||'-'}</td>
    <td class="phone">${c.phone||'-'}</td>
    <td class="address">${c.address||'-'}</td>
    <td class="service"><span class="type-badge ${TYPE_CLASS[c.type]||'bo'}">${TYPE_LABEL[c.type]||c.type}</span><br><span style="color:#666;font-size:11px">${c.service||''}</span></td>
    <td class="price ${!c.price?'zero':''}">${fmt(c.price)}</td>
    <td><span class="year-badge ${c.year==='2024'?'y2024':c.year==='2023'?'y2023':c.year==='2026'?'y2026':'y2025'}">${c.year||'-'}</span></td>
    <td><span class="agent-badge ${c.agent==='양민하'?'a-ymh':c.agent==='류종수'?'a-rjs':c.agent==='조상연'?'a-jsy':c.agent==='이동윤'?'a-idy':c.agent==='정성환'?'a-jsh':c.agent==='이해권'?'a-lhk':c.agent==='이신우'?'a-isw':c.agent==='김태경'?'a-ktk':c.agent==='강규남'?'a-kkn':c.agent==='신한일'?'a-shl':c.agent==='이종명'?'a-ljm':c.agent==='이창한'?'a-lch':c.agent==='정석찬'?'a-jsc':c.agent==='정재훈'?'a-jjh':'a-none'}">${c.agent||'미지정'}</span></td>
    <td class="note">${c.note||''}</td>
    <td><div class="actions-cell">
      <button class="act-btn act-edit" onclick="event.stopPropagation();openEdit('${c.id}')">수정</button>
      <button class="act-btn act-del" onclick="event.stopPropagation();del('${c.id}')">삭제</button>
    </div></td>
  </tr>`).join('');
}

// ===== 행 클릭 시 고객정보 복사 =====
function copyRow(id, event){
  // 버튼 클릭 시 복사 안 되게 (수정/삭제 버튼 영역 클릭 무시)
  if(event && event.target && event.target.closest('button')) return;
  const c = data.find(x=>x.id===id);
  if(!c) return;
  // 가격 포맷: 12만원 형식 (만원 단위면 'X만원', 아니면 그냥 숫자+원)
  let priceStr = '';
  if(c.price && c.price > 0){
    if(c.price % 10000 === 0){
      priceStr = (c.price/10000) + '만원';
    } else {
      priceStr = c.price.toLocaleString() + '원';
    }
  }
  // 서비스 표시: 종류 + 상세 (예: 4웨이1대)
  const typeLabel = TYPE_LABEL[c.type] || c.type || '';
  const serviceStr = c.service ? (typeLabel ? typeLabel + ' ' + c.service : c.service) : typeLabel;
  // 슬러시 구분 (빈 값은 제외)
  const parts = [c.name, c.phone, c.address, serviceStr, priceStr].filter(v => v && String(v).trim() !== '');
  const text = parts.join(' / ');
  // 클립보드 복사
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast('복사 완료: ' + text);
    }).catch(()=>{
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); showToast('복사 완료: ' + text); }
  catch(e){ alert('복사 실패. 수동으로 복사해주세요:\n' + text); }
  document.body.removeChild(ta);
}
function showToast(msg){
  let t = document.getElementById('copy-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'copy-toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e2130;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,0.25);max-width:90%;word-break:keep-all;text-align:center;opacity:0;transition:opacity 0.2s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity = '0'; }, 2000);
}

function setFilter(el,key,val){
  filters[key]=val;
  document.querySelectorAll(`[data-f="${key}"]`).forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  render();
}

function openAdd(){
  editIdx=null;
  document.getElementById('modal-title').textContent='고객 추가';
  ['phone','name','address','price','service','note'].forEach(f=>{const el=document.getElementById('f-'+f);if(el)el.value='';});
  document.getElementById('f-type').value='4way';
  document.getElementById('f-year').value='2025';
  document.getElementById('f-agent').value='';
  document.getElementById('modal').classList.add('show');
}
function openEdit(id){
  const c=data.find(x=>x.id===id); if(!c)return;
  editIdx=id;
  document.getElementById('modal-title').textContent='고객 수정';
  document.getElementById('f-phone').value=c.phone||'';
  document.getElementById('f-name').value=c.name||'';
  document.getElementById('f-address').value=c.address||'';
  document.getElementById('f-type').value=c.type||'other';
  document.getElementById('f-price').value=c.price||'';
  document.getElementById('f-service').value=c.service||'';
  document.getElementById('f-year').value=c.year||'2025';
  document.getElementById('f-agent').value=c.agent||'';
  document.getElementById('f-note').value=c.note||'';
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
async function saveCustomer(){
  if(!isAdmin()){alert('관리자 로그인이 필요합니다');showLogin();return;}
  const phone=document.getElementById('f-phone').value.trim();
  if(!phone){alert('전화번호를 입력해주세요.');return;}
  const obj={phone,name:document.getElementById('f-name').value.trim(),address:document.getElementById('f-address').value.trim(),type:document.getElementById('f-type').value,price:parseInt(document.getElementById('f-price').value)||0,service:document.getElementById('f-service').value.trim(),year:document.getElementById('f-year').value,agent:document.getElementById('f-agent').value,note:document.getElementById('f-note').value.trim()};
  
  if(!editIdx){
    // 새 고객 추가
    obj.id='new_'+Date.now();
    const res = await apiPost('add', {customer: obj});
    if(res && res.success){
      data.unshift(obj);
      closeModal();render();
    }
  }else{
    // 수정
    const idx=data.findIndex(x=>x.id===editIdx);
    if(idx>-1){
      obj.id = editIdx;
      const res = await apiPost('update', {customer: obj});
      if(res && res.success){
        data[idx]={...data[idx],...obj};
        closeModal();render();
      }
    }
  }
}
async function del(id){
  if(!isAdmin()){alert('관리자 로그인이 필요합니다');showLogin();return;}
  if(!confirm('삭제할까요?'))return;
  const res = await apiPost('delete', {id: id});
  if(res && res.success){
    data=data.filter(x=>x.id!==id);
    render();
  }
}
function resetData(){
  alert('서버 데이터는 직접 초기화할 수 없습니다. 관리자에게 문의하세요.');
}
function exportCSV(){
  const bom='\uFEFF';
  const header=['전화번호','이름','주소','서비스종류','서비스상세','금액','년도','기사명','메모'];
  // Apply current filters
  const q=document.getElementById('search').value.trim().toLowerCase();
  let list=data.filter(c=>{
    if(filters.year!=='all'&&c.year!==filters.year)return false;
    if(filters.agent==='none'){if(c.agent&&c.agent!=='')return false;}
    else if(filters.agent!=='all'&&c.agent!==filters.agent)return false;
    if(filters.type!=='all'&&c.type!==filters.type)return false;
    if(q&&![(c.phone||''),(c.name||''),(c.address||''),(c.agent||'')].some(v=>v.toLowerCase().includes(q)))return false;
    return true;
  });
  const rows=list.map(c=>[c.phone,c.name,c.address,TYPE_LABEL[c.type]||c.type,c.service,c.price||0,c.year,c.agent,c.note].map(v=>'"'+(String(v||'').replace(/"/g,'""'))+'"').join(','));
  const csv=bom+header.join(',')+'\n'+rows.join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  const yearStr=filters.year==='all'?'전체':filters.year;
  const agentStr=filters.agent==='all'?'전체':filters.agent;
  a.download=`고객리스트_${yearStr}_${agentStr}.csv`;a.click();
}
async function init(){
  await load();
  render();
}
init();
